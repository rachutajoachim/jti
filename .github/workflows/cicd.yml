name: Deploy to Azure

on:
  push:
    branches:
      - dev
      - stage
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      TF_VAR_environment: ${{ github.ref_name }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.APPLICATION_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_PASSWORD }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Branch Name
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Debug Branch Name
        run: echo "Deploying to $BRANCH_NAME environment"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Terraform
        run: terraform init -backend-config="backend-${{ env.BRANCH_NAME }}.conf"

      - name: Terrafom Destroy
        working-directory: Terraform
        run: terraform destroy -auto-approve -var="environment=${{ env.BRANCH_NAME }}"

      - name: Terraform Plan
        working-directory: Terraform
        run: terraform plan -var="environment=${{ env.BRANCH_NAME }}"
      
      - name: Terrafom Apply
        working-directory: Terraform
        run: terraform apply -auto-approve -var="environment=${{ env.BRANCH_NAME }}"